name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Repository hygiene / secret checks
        run: python3 tools/check_repository.py
      - name: Compile integration
        run: python3 -m compileall -q custom_components/kress_fleet
